{% extends "emails/base_email.html" %}
{% block content %}
  <h2 style="margin:0 0 12px;color:#10243A;font-size:22px;">Password reset request</h2>
  <p style="margin:0 0 16px;line-height:1.65;">
    Hello <strong>{{ name }}</strong>, we received a request to reset your password. This link expires in <strong>2 hours</strong>.
  </p>
  <p style="text-align:center;margin:22px 0;">
    <a href="{{ reset_url }}" style="display:inline-block;background:#C9A45C;color:#081D33;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:8px;">Set new password</a>
  </p>
  <p style="font-size:12px;color:#888;word-break:break-all;">{{ reset_url }}</p>
  <p style="font-size:12px;color:#888;">If you did not request this, ignore this email.</p>
{% endblock %}
