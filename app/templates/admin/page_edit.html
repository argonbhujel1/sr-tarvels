{% extends "admin/layout.html" %}
{% block title %}Edit Page{% endblock %}
{% block content %}
<h1 style="margin-bottom:1.5rem;">Edit Page: {{ page.slug }}</h1>
<form method="post" class="card" style="padding:1.5rem; max-width:900px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="grid-2">
    <div class="form-group">
      <label>Title (Nepali)</label>
      <input type="text" name="title_ne" class="form-control" value="{{ page.title_ne or '' }}">
    </div>
    <div class="form-group">
      <label>Title (English)</label>
      <input type="text" name="title_en" class="form-control" value="{{ page.title_en or '' }}">
    </div>
  </div>
  <div class="form-group">
    <label>Content (Nepali)</label>
    <textarea name="content_ne" class="form-control" rows="8">{{ page.content_ne or '' }}</textarea>
  </div>
  <div class="form-group">
    <label>Content (English)</label>
    <textarea name="content_en" class="form-control" rows="8">{{ page.content_en or '' }}</textarea>
  </div>
  <div class="grid-2">
    <div class="form-group">
      <label>Meta Title (Nepali)</label>
      <input type="text" name="meta_title_ne" class="form-control" value="{{ page.meta_title_ne or '' }}">
    </div>
    <div class="form-group">
      <label>Meta Title (English)</label>
      <input type="text" name="meta_title_en" class="form-control" value="{{ page.meta_title_en or '' }}">
    </div>
  </div>
  <div class="grid-2">
    <div class="form-group">
      <label>Meta Description (Nepali)</label>
      <input type="text" name="meta_description_ne" class="form-control" value="{{ page.meta_description_ne or '' }}">
    </div>
    <div class="form-group">
      <label>Meta Description (English)</label>
      <input type="text" name="meta_description_en" class="form-control" value="{{ page.meta_description_en or '' }}">
    </div>
  </div>
  <div class="form-group">
    <label><input type="checkbox" name="is_published" {% if page.is_published %}checked{% endif %}> Published</label>
  </div>
  <div style="display:flex; gap:0.75rem;">
    <button type="submit" class="btn btn-primary">Save Page</button>
    <a href="{{ url_for('admin.pages') }}" class="btn btn-outline">Cancel</a>
  </div>
</form>
{% endblock %}
