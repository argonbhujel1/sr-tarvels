{% extends "admin/layout.html" %}
{% block title %}Edit Branch{% endblock %}
{% block content %}
<h1 style="margin-bottom:1.5rem;">Edit Branch</h1>
<form method="post" class="card" style="padding:1.5rem; max-width:800px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="grid-2">
    <div class="form-group">
      <label>Name (Nepali)</label>
      <input type="text" name="name_ne" class="form-control" value="{{ branch.name_ne or '' }}">
    </div>
    <div class="form-group">
      <label>Name (English)</label>
      <input type="text" name="name_en" class="form-control" value="{{ branch.name_en or '' }}">
    </div>
  </div>
  <div class="form-group">
    <label>Address (Nepali)</label>
    <textarea name="address_ne" class="form-control" rows="2">{{ branch.address_ne or '' }}</textarea>
  </div>
  <div class="form-group">
    <label>Address (English)</label>
    <textarea name="address_en" class="form-control" rows="2">{{ branch.address_en or '' }}</textarea>
  </div>
  <div class="grid-2">
    <div class="form-group">
      <label>Phone</label>
      <input type="text" name="phone" class="form-control" value="{{ branch.phone or '' }}">
    </div>
    <div class="form-group">
      <label>WhatsApp</label>
      <input type="text" name="whatsapp" class="form-control" value="{{ branch.whatsapp or '' }}">
    </div>
  </div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" name="email" class="form-control" value="{{ branch.email or '' }}">
  </div>
  <div class="grid-2">
    <div class="form-group">
      <label>Hours (Nepali)</label>
      <input type="text" name="hours_ne" class="form-control" value="{{ branch.hours_ne or '' }}">
    </div>
    <div class="form-group">
      <label>Hours (English)</label>
      <input type="text" name="hours_en" class="form-control" value="{{ branch.hours_en or '' }}">
    </div>
  </div>
  <div class="grid-2">
    <div class="form-group">
      <label>Sort Order</label>
      <input type="number" name="sort_order" class="form-control" value="{{ branch.sort_order or 0 }}">
    </div>
    <div class="form-group" style="padding-top:1.5rem;">
      <label><input type="checkbox" name="is_published" {% if branch.is_published %}checked{% endif %}> Published</label>
    </div>
  </div>
  <div style="display:flex; gap:0.75rem;">
    <button type="submit" class="btn btn-primary">Save Branch</button>
    <a href="{{ url_for('admin.branches') }}" class="btn btn-outline">Cancel</a>
  </div>
</form>
{% endblock %}
