{% extends "admin/layout.html" %}
{% block title %}Edit Category{% endblock %}
{% block content %}
<h1 style="margin-bottom:1.5rem;">Edit Category</h1>
<form method="post" enctype="multipart/form-data" class="card" style="padding:1.5rem;max-width:700px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="grid-2">
    <div class="form-group"><label>Name (Nepali)</label><input type="text" name="name_ne" class="form-control" value="{{ category.name_ne }}" required></div>
    <div class="form-group"><label>Name (English)</label><input type="text" name="name_en" class="form-control" value="{{ category.name_en }}" required></div>
  </div>
  <div class="form-group"><label>Description (Nepali)</label><textarea name="description_ne" class="form-control" rows="3">{{ category.description_ne or '' }}</textarea></div>
  <div class="form-group"><label>Description (English)</label><textarea name="description_en" class="form-control" rows="3">{{ category.description_en or '' }}</textarea></div>
  <div class="form-group">
    <label>Image URL</label>
    <input type="text" name="image_url" class="form-control" value="{{ category.image_url or '' }}" placeholder="https://...">
  </div>
  <div class="form-group">
    <label>Or upload image</label>
    <input type="file" name="image_file" class="form-control" accept="image/*">
    {% if category.image_url %}
    <p style="margin-top:0.5rem;"><img src="{{ category.image_url }}" alt="" style="max-height:120px;border-radius:8px;"></p>
    {% endif %}
  </div>
  <div class="grid-2">
    <div class="form-group"><label>Sort Order</label><input type="number" name="sort_order" class="form-control" value="{{ category.sort_order or 0 }}"></div>
    <div class="form-group" style="padding-top:1.5rem;"><label><input type="checkbox" name="is_published" {% if category.is_published %}checked{% endif %}> Published</label></div>
  </div>
  <button type="submit" class="btn btn-primary">Save Category</button>
  <a href="{{ url_for('admin.services') }}" class="btn btn-outline">Back</a>
</form>
{% endblock %}
