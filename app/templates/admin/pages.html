{% extends "admin/layout.html" %}
{% block title %}Pages{% endblock %}
{% block content %}
<h1 style="margin-bottom:1.5rem;">Pages</h1>
<div class="card" style="padding:0; overflow:hidden;">
  <table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
    <thead>
      <tr style="text-align:left; background:#f8fafc; border-bottom:1px solid var(--border);">
        <th style="padding:0.75rem 1rem;">Slug</th>
        <th>Title (EN)</th>
        <th>Published</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for p in pages %}
      <tr style="border-bottom:1px solid var(--border);">
        <td style="padding:0.75rem 1rem;"><code>{{ p.slug }}</code></td>
        <td>{{ p.title_en or p.title_ne }}</td>
        <td>{% if p.is_published %}✓{% else %}—{% endif %}</td>
        <td style="padding:0.75rem 1rem;">
          <a href="{{ url_for('admin.page_edit', id=p.id) }}" class="btn btn-navy" style="padding:0.35rem 0.75rem; font-size:0.8rem;">Edit</a>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" style="padding:1.5rem;">No pages found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
