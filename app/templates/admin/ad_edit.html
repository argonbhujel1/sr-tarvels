{% extends "admin/layout.html" %}
{% block title %}Edit ad{% endblock %}
{% block content %}
<h1 style="margin-bottom:1rem;">Edit ad</h1>
<form method="post" enctype="multipart/form-data" class="card" style="padding:1.5rem;max-width:560px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group"><label>Title</label><input type="text" name="title" class="form-control" value="{{ ad.title }}" required></div>
  <div class="form-group">
    <label>Placement</label>
    <select name="placement" class="form-control">
      {% for key, label in placements %}
      <option value="{{ key }}" {% if ad.placement == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group"><label>Click URL</label><input type="url" name="link_url" class="form-control" value="{{ ad.link_url or '' }}"></div>
  <div class="form-group"><label>Image URL</label><input type="text" name="image_url" class="form-control" value="{{ ad.image_url or '' }}"></div>
  {% if ad.image_url %}<p><img src="{{ ad.image_url }}" alt="" style="max-width:100%;max-height:160px;border-radius:8px;"></p>{% endif %}
  <div class="form-group"><label>Upload new image</label><input type="file" name="image_file" class="form-control" accept="image/*"></div>
  <div class="form-group"><label>Custom HTML</label><textarea name="html_code" class="form-control" rows="4">{{ ad.html_code or '' }}</textarea></div>
  <div class="form-group"><label>Sort order</label><input type="number" name="sort_order" class="form-control" value="{{ ad.sort_order or 0 }}"></div>
  <div class="form-group"><label><input type="checkbox" name="is_active" {% if ad.is_active %}checked{% endif %}> Active</label></div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('admin.ads_admin') }}" class="btn btn-outline">Back</a>
</form>
{% endblock %}
