{% extends "admin/layout.html" %}
{% block title %}{{ 'New Service' if not service else 'Edit Service' }}{% endblock %}
{% block content %}
<h1 style="margin-bottom:1.5rem;">{{ 'New Service' if not service else 'Edit Service' }}</h1>
<form method="post" class="card" style="padding:1.5rem; max-width:900px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  {% if not service %}
  <div class="form-group">
    <label>Slug (URL) *</label>
    <input type="text" name="slug" class="form-control" required placeholder="e.g. domestic-flights">
  </div>
  {% endif %}

  <div class="form-group">
    <label>Category</label>
    <select name="category_id" class="form-control" required>
      {% for c in categories %}
      <option value="{{ c.id }}" {% if service and service.category_id == c.id %}selected{% endif %}>{{ c.name_en }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label>Name (Nepali)</label>
      <input type="text" name="name_ne" class="form-control" value="{{ service.name_ne if service else '' }}" required>
    </div>
    <div class="form-group">
      <label>Name (English)</label>
      <input type="text" name="name_en" class="form-control" value="{{ service.name_en if service else '' }}" required>
    </div>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label>Short Description (Nepali)</label>
      <textarea name="short_desc_ne" class="form-control" rows="2">{{ service.short_desc_ne if service else '' }}</textarea>
    </div>
    <div class="form-group">
      <label>Short Description (English)</label>
      <textarea name="short_desc_en" class="form-control" rows="2">{{ service.short_desc_en if service else '' }}</textarea>
    </div>
  </div>

  <div class="form-group">
    <label>Full Description (Nepali)</label>
    <textarea name="description_ne" class="form-control" rows="5">{{ service.description_ne if service else '' }}</textarea>
  </div>
  <div class="form-group">
    <label>Full Description (English)</label>
    <textarea name="description_en" class="form-control" rows="5">{{ service.description_en if service else '' }}</textarea>
  </div>

  <div class="form-group">
    <label>Requirements (Nepali)</label>
    <textarea name="requirements_ne" class="form-control" rows="3">{{ service.requirements_ne if service else '' }}</textarea>
  </div>
  <div class="form-group">
    <label>Requirements (English)</label>
    <textarea name="requirements_en" class="form-control" rows="3">{{ service.requirements_en if service else '' }}</textarea>
  </div>

  <div class="form-group">
    <label>Price (NPR) — optional fixed price shown to customers</label>
    <input type="number" step="0.01" name="price_npr" class="form-control" value="{{ service.price_npr if service and service.price_npr is not none else '' }}" style="max-width:200px;">
  </div>
  <div class="grid-2">
    <div class="form-group">
      <label>Pricing Info (Nepali)</label>
      <textarea name="pricing_info_ne" class="form-control" rows="2">{{ service.pricing_info_ne if service else '' }}</textarea>
    </div>
    <div class="form-group">
      <label>Pricing Info (English)</label>
      <textarea name="pricing_info_en" class="form-control" rows="2">{{ service.pricing_info_en if service else '' }}</textarea>
    </div>
  </div>

  <div class="form-group">
    <label>Image URL</label>
    <input type="text" name="image_url" class="form-control" value="{{ service.image_url if service else '' }}">
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label>Sort Order</label>
      <input type="number" name="sort_order" class="form-control" value="{{ service.sort_order if service else 0 }}">
    </div>
    <div class="form-group" style="padding-top:1.5rem;">
      <label style="margin-right:1.5rem;"><input type="checkbox" name="is_published" {% if not service or service.is_published %}checked{% endif %}> Published</label>
      <label><input type="checkbox" name="is_featured" {% if service and service.is_featured %}checked{% endif %}> Featured</label>
      <label style="margin-left:1rem;"><input type="checkbox" name="requires_documents" {% if service and service.requires_documents %}checked{% endif %}> Requires documents</label>
    </div>
  </div>

  <div style="display:flex; gap:0.75rem; margin-top:1rem;">
    <button type="submit" class="btn btn-primary">Save Service</button>
    <a href="{{ url_for('admin.services') }}" class="btn btn-outline">Cancel</a>
  </div>
</form>
{% endblock %}
