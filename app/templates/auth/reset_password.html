{% extends "base.html" %}
{% block title %}{% if lang == 'ne' %}नयाँ पासवर्ड{% else %}New password{% endif %}{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:440px;">
    <h1 class="section-title">{% if lang == 'ne' %}नयाँ पासवर्ड सेट गर्नुहोस्{% else %}Set new password{% endif %}</h1>
    <form method="post" class="card" style="padding:1.75rem;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>{% if lang == 'ne' %}नयाँ पासवर्ड{% else %}New password{% endif %}</label>
        <input type="password" name="password" class="form-control" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">{% if lang == 'ne' %}अपडेट{% else %}Update{% endif %}</button>
    </form>
  </div>
</section>
{% endblock %}
